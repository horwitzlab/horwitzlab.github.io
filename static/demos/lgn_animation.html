<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LGN Natural Foraging</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0 8px;
    font-family: system-ui, sans-serif;
    color: #ccc;
    user-select: none;
  }
  canvas {
    display: block;
    cursor: pointer;
    border: 1px solid #333;
    background: #000;
  }
  #controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 7px;
    width: 800px;
    flex-wrap: wrap;
  }
  #playBtn {
    background: #2a6;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 5px 14px;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #playBtn:hover { background: #3b7; }
  #timeline {
    flex: 1;
    min-width: 100px;
    accent-color: #2a6;
    cursor: pointer;
  }
  #timeLabel { font-size: 12px; color: #aaa; flex-shrink: 0; min-width: 60px; }
  label { font-size: 12px; color: #888; flex-shrink: 0; }
  select {
    background: #222; color: #ccc;
    border: 1px solid #444; border-radius: 3px;
    padding: 3px 6px; font-size: 12px; cursor: pointer;
  }
  #status {
    font-size: 11px;
    color: #666;
    margin-top: 4px;
    width: 800px;
    text-align: left;
    padding-left: 2px;
    min-height: 15px;
  }
</style>
</head>
<body>
<canvas id="canvas" width="800" height="600"></canvas>
<div id="controls">
  <button id="playBtn">&#9654; Play</button>
  <input type="range" id="timeline" min="0" max="99" value="0" step="1">
  <span id="timeLabel">0.00 s</span>
  <label for="speed">Speed</label>
  <select id="speed">
    <option value="0.25">0.25&times;</option>
    <option value="0.5">0.5&times;</option>
    <option value="1" selected>1&times;</option>
    <option value="2">2&times;</option>
  </select>
</div>
<div id="status">Loading&hellip;</div>

<script>
// Canvas & FOV constants
const CW = 800, CH = 600;
var PPD = 20;
var FOV_X_MIN = -15, FOV_X_MAX = 25;
var FOV_Y_MIN = -10, FOV_Y_MAX = 20;
var X_BASE, Y_BASE;

function computeBaseOffsets() {
  // canvas center shows the gaze position (retinal-coordinate display)
  // draw_x = X_BASE - gx * PPD   draw_y = Y_BASE + gy * PPD
  X_BASE = CW/2 + FOV_X_MIN * PPD;   // 400 + (-15)*20 = 100
  Y_BASE = CH/2 - FOV_Y_MAX * PPD;   // 300 -  20 *20 = -100
}

// Animation state
var nFrames = 0, frameDt = 1/20;
var gazeX, gazeY;
var rfCx, rfCy, rfR;
var firingRates;
var globalMaxFR = 1;
var bgImage = null;
var nUnits = 0;
var currentFrame = 0;
var playing = false;
var lastTimestamp = null;
var speed = 1.0;
var demoMode = true;

var canvas  = document.getElementById('canvas');
var ctx     = canvas.getContext('2d');
var playBtn = document.getElementById('playBtn');
var tl      = document.getElementById('timeline');
var timeLbl = document.getElementById('timeLabel');
var statusEl= document.getElementById('status');

// Colour scale: black -> red -> orange-white
function frColor(norm) {
  if (norm <= 0) return 'rgb(0,0,0)';
  if (norm < 0.5) {
    var t = norm * 2;
    return 'rgb('+Math.round(220*t)+',0,0)';
  }
  var t = (norm - 0.5) * 2;
  return 'rgb(220,'+Math.round(220*t)+','+Math.round(180*t)+')';
}

// Draw one frame
function drawFrame(f) {
  f = Math.max(0, Math.min(nFrames - 1, f));
  ctx.clearRect(0, 0, CW, CH);

  // 1. Background image with gaze compensation (fixation stays at canvas center)
  var gx = gazeX[f], gy = gazeY[f];
  var dx = X_BASE - gx * PPD;
  var dy = Y_BASE + gy * PPD;
  if (bgImage) {
    ctx.drawImage(bgImage, dx, dy, 800, 600);
  } else {
    ctx.fillStyle = '#1a2a1a';
    ctx.fillRect(0, 0, CW, CH);
  }

  // 2. RF circles at fixed screen positions (no gaze compensation)
  for (var u = 0; u < nUnits; u++) {
    var norm = firingRates[u * nFrames + f] / globalMaxFR;
    var cx = rfCx[u], cy = rfCy[u], r = rfR[u];
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fillStyle = frColor(norm);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,'+(0.15 + 0.4 * norm).toFixed(2)+')';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // 3. Crosshair at canvas center = current gaze position
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 1;
  var hs = 10;
  ctx.beginPath();
  ctx.moveTo(CW/2 - hs, CH/2); ctx.lineTo(CW/2 + hs, CH/2);
  ctx.moveTo(CW/2, CH/2 - hs); ctx.lineTo(CW/2, CH/2 + hs);
  ctx.stroke();
}

// Animation loop
function step(ts) {
  if (!playing) return;
  if (lastTimestamp === null) lastTimestamp = ts;
  var elapsed = (ts - lastTimestamp) / 1000;
  lastTimestamp = ts;

  currentFrame += elapsed * speed / frameDt;
  if (currentFrame >= nFrames) {
    currentFrame = nFrames - 1;
    playing = false;
    playBtn.textContent = '▶ Play';
    lastTimestamp = null;
  }

  var f = Math.floor(currentFrame);
  drawFrame(f);
  tl.value = f;
  timeLbl.textContent = (f * frameDt).toFixed(2) + ' s';

  if (playing) requestAnimationFrame(step);
}

function togglePlay() {
  playing = !playing;
  playBtn.textContent = playing ? '⏸ Pause' : '▶ Play';
  if (playing) {
    if (Math.floor(currentFrame) >= nFrames - 1) currentFrame = 0;
    lastTimestamp = null;
    requestAnimationFrame(step);
  }
}

canvas.addEventListener('click', togglePlay);
playBtn.addEventListener('click', togglePlay);
tl.addEventListener('input', function() {
  currentFrame = parseInt(tl.value);
  drawFrame(currentFrame);
  timeLbl.textContent = (currentFrame * frameDt).toFixed(2) + ' s';
});
document.getElementById('speed').addEventListener('change', function(e) {
  speed = parseFloat(e.target.value);
});

// Seeded PRNG (Mulberry32)
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Gaussian smooth
function gaussSmooth(arr, sigma) {
  var n = arr.length;
  var hw = Math.ceil(3 * sigma);
  var kernel = [], ksum = 0;
  for (var i = -hw; i <= hw; i++) {
    var v = Math.exp(-0.5 * Math.pow(i/sigma, 2));
    kernel.push(v); ksum += v;
  }
  for (var i = 0; i < kernel.length; i++) kernel[i] /= ksum;
  var out = new Float32Array(n);
  for (var i = 0; i < n; i++) {
    var s = 0;
    for (var j = 0; j < kernel.length; j++) {
      var idx = Math.min(n-1, Math.max(0, i - hw + j));
      s += arr[idx] * kernel[j];
    }
    out[i] = s;
  }
  return out;
}

// Procedural placeholder image
function makeDemoImage() {
  var oc = new OffscreenCanvas(800, 600);
  var oc2 = oc.getContext('2d');
  var rng = mulberry32(42);

  var sky = oc2.createLinearGradient(0,0,0,350);
  sky.addColorStop(0, '#3a6fa0');
  sky.addColorStop(0.6, '#a0c8e0');
  sky.addColorStop(1, '#d8e8f0');
  oc2.fillStyle = sky;
  oc2.fillRect(0,0,800,350);

  var haze = oc2.createLinearGradient(0,320,0,380);
  haze.addColorStop(0,'rgba(200,220,230,0)');
  haze.addColorStop(1,'rgba(200,220,230,0.5)');
  oc2.fillStyle = haze;
  oc2.fillRect(0,320,800,60);

  var gnd = oc2.createLinearGradient(0,350,0,600);
  gnd.addColorStop(0,'#5a8040');
  gnd.addColorStop(0.4,'#486030');
  gnd.addColorStop(1,'#304020');
  oc2.fillStyle = gnd;
  oc2.fillRect(0,350,800,250);

  oc2.fillStyle = '#1a2f10';
  for (var i = 0; i < 18; i++) {
    var tx = rng() * 900 - 50;
    var th = 60 + rng() * 100;
    var ty = 310 - th * 0.5;
    var tw = 20 + rng() * 30;
    oc2.fillRect(tx - tw*0.1, ty + th*0.5, tw*0.2, th*0.5);
    oc2.beginPath();
    oc2.ellipse(tx, ty + th*0.3, tw*0.5, th*0.6, 0, 0, Math.PI*2);
    oc2.fill();
  }

  var id = oc2.getImageData(0,0,800,600);
  var dat = id.data;
  var nrng = mulberry32(99);
  for (var i = 0; i < dat.length; i += 4) {
    var n = (nrng() - 0.5) * 20;
    dat[i]   = Math.max(0, Math.min(255, dat[i]   + n));
    dat[i+1] = Math.max(0, Math.min(255, dat[i+1] + n));
    dat[i+2] = Math.max(0, Math.min(255, dat[i+2] + n));
  }
  oc2.putImageData(id, 0, 0);
  return oc;
}

// Build demo data
function buildDemoData() {
  demoMode = true;
  nFrames = 200;
  frameDt = 1/20;
  FOV_X_MIN = -15; FOV_X_MAX = 25;
  FOV_Y_MIN = -10; FOV_Y_MAX = 20;
  PPD = 20;
  computeBaseOffsets();

  var rng = mulberry32(7);
  nUnits = 30;

  var rfx = [], rfy = [], rfr_a = [];
  for (var u = 0; u < nUnits; u++) {
    rfx.push(8  + rng() * 12);
    rfy.push(1  + rng() * 12);
    rfr_a.push(0.15 + rng() * 0.2);
  }

  gazeX = new Float32Array(nFrames);
  gazeY = new Float32Array(nFrames);

  var fixations = [
    {x: 2.0, y: 1.0, dur: 50},
    {x:-2.5, y:-1.5, dur: 40},
    {x: 5.0, y: 2.5, dur: 45},
    {x:-1.0, y: 3.0, dur: 35},
    {x: 3.5, y:-2.0, dur: 30}
  ];
  var f = 0;
  for (var fi = 0; fi < fixations.length && f < nFrames; fi++) {
    var fix = fixations[fi];
    var end = Math.min(f + fix.dur, nFrames);
    for (var i = f; i < end; i++) {
      gazeX[i] = fix.x + (rng()-0.5) * 0.3;
      gazeY[i] = fix.y + (rng()-0.5) * 0.3;
    }
    f = end;
  }
  while (f < nFrames) { gazeX[f] = 0; gazeY[f] = 0; f++; }

  firingRates = new Float32Array(nUnits * nFrames);
  globalMaxFR = 1;

  for (var u = 0; u < nUnits; u++) {
    var spont = 5 + rng() * 10;
    var raw = new Float32Array(nFrames);
    for (var i = 0; i < nFrames; i++) raw[i] = spont + rng() * 3;
    for (var i = 1; i < nFrames; i++) {
      var dgx = gazeX[i]-gazeX[i-1], dgy = gazeY[i]-gazeY[i-1];
      var dg = Math.sqrt(dgx*dgx + dgy*dgy);
      if (dg > 0.5) {
        var burst = 40 + rng() * 120;
        var lat = Math.floor(2 + rng() * 4);
        var dur = Math.floor(4 + rng() * 6);
        for (var j = lat; j < lat + dur && i+j < nFrames; j++) {
          raw[i+j] = Math.max(raw[i+j], burst * Math.exp(-0.5 * Math.pow((j-lat-1)/2, 2)));
        }
      }
    }
    var smooth = gaussSmooth(raw, 2);
    for (var i = 0; i < nFrames; i++) {
      var v = Math.max(0, smooth[i]);
      firingRates[u * nFrames + i] = v;
      if (v > globalMaxFR) globalMaxFR = v;
    }
  }

  rfCx = new Float32Array(nUnits);
  rfCy = new Float32Array(nUnits);
  rfR  = new Float32Array(nUnits);
  for (var u = 0; u < nUnits; u++) {
    rfCx[u] = CW/2 + rfx[u] * PPD;
    rfCy[u] = CH/2 - rfy[u] * PPD;
    rfR[u]  = Math.max(5, rfr_a[u] * PPD);
  }

  bgImage = makeDemoImage();
  tl.max = nFrames - 1;
  statusEl.textContent =
    'Demo — place lgn_animation_data.json beside this file to load real data  |  '+
    nUnits+' synthetic units  |  '+(nFrames * frameDt).toFixed(1)+' s';
}

// Load real JSON
function loadRealData(json) {
  return new Promise(function(resolve, reject) {
    demoMode = false;
    nFrames  = json.gaze_x_deg.length;
    frameDt  = (json.meta && json.meta.frame_dt_s) ? json.meta.frame_dt_s : 0.05;

    var fov = json.image_fov_deg;
    FOV_X_MIN = fov.x_min; FOV_X_MAX = fov.x_max;
    FOV_Y_MIN = fov.y_min; FOV_Y_MAX = fov.y_max;
    PPD = (json.image_width_px || 800) / (FOV_X_MAX - FOV_X_MIN);
    computeBaseOffsets();

    gazeX = new Float32Array(json.gaze_x_deg);
    gazeY = new Float32Array(json.gaze_y_deg);

    var centers = json.rf_centers;
    nUnits = centers.length;
    rfCx = new Float32Array(nUnits);
    rfCy = new Float32Array(nUnits);
    rfR  = new Float32Array(nUnits);
    for (var u = 0; u < nUnits; u++) {
      var c = centers[u];
      rfCx[u] = CW/2 + c.x * PPD;
      rfCy[u] = CH/2 - c.y * PPD;
      rfR[u]  = Math.max(4, c.radius_deg * PPD);
    }

    // Use pre-normalized rates if available (new format), else normalize raw
    var ratesSource = json.firing_rates_norm || json.firing_rates;
    var preNormed = !!json.firing_rates_norm;
    globalMaxFR = preNormed ? 1 : 1e-9;
    firingRates = new Float32Array(nUnits * nFrames);
    for (var u = 0; u < nUnits; u++) {
      var row = ratesSource[u];
      for (var f = 0; f < nFrames; f++) {
        var v = Math.max(0, row[f] || 0);
        firingRates[u * nFrames + f] = v;
        if (!preNormed && v > globalMaxFR) globalMaxFR = v;
      }
    }

    var fmt = json.image_format || 'jpeg';
    var dataUrl = 'data:image/' + fmt + ';base64,' + json.image_base64;
    var img = new Image();
    img.onload = function() {
      createImageBitmap(img).then(function(bmp) {
        bgImage = bmp;
        tl.max = nFrames - 1;
        var dur = (nFrames * frameDt).toFixed(1);
        var sess = (json.meta && json.meta.session) ? json.meta.session : 'Real data';
        statusEl.textContent =
          sess + '  |  ' + nUnits + ' units  |  ' + dur +
          (preNormed ? ' s  |  per-unit normalized' : ' s  |  max FR = ' + globalMaxFR.toFixed(0) + ' spk/s');
        resolve();
      });
    };
    img.onerror = function() { reject(new Error('image decode failed')); };
    img.src = dataUrl;
  });
}

// Init
function init() {
  statusEl.textContent = 'Loading…';
  fetch('./lgn_animation_data.json')
    .then(function(r) {
      if (!r.ok) throw new Error('not found');
      return r.json();
    })
    .then(function(json) {
      return loadRealData(json);
    })
    .then(function() {
      drawFrame(0);
    })
    .catch(function() {
      buildDemoData();
      drawFrame(0);
    });
}

init();
</script>
</body>
</html>
