const T_START = -0.3, T_END = 2.5;

let g = 0, playing = false, lastTs = null;

function getPhase(gv) {
  if (gv < TRIAL_DUR) return { trial: 'no_laser', t: T_START + gv, frac: null };
  if (gv < TRIAL_DUR + GAP) return { trial: 'transition', t: null, frac: (gv - TRIAL_DUR) / GAP };

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);

ctx.scale(DPR, DPR);

const PAD = 10;
const DISC_Y = PAD, DISC_H = 170;

function lerp(arr, times, t) {

function tToX(t) { return PAD + (t - T_START) / (T_END - T_START) * INNER_W; }

const DEPTHS = DATA.no_laser.spikes.map(u => u.depth);

function drawStimDisplay(trial, t) {

    ctx.fillStyle = 'rgba(249,115,22,0.18)';
    ctx.fillRect(sx1, RAST_Y, sx2 - sx1, RAST_H);
    // Top border line
    ctx.strokeStyle = 'rgba(249,115,22,0.6)'; ctx.lineWidth = 1;
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(sx1, RAST_Y); ctx.lineTo(sx1, RAST_Y + RAST_H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx2, RAST_Y); ctx.lineTo(sx2, RAST_Y + RAST_H); ctx.stroke();
    // Label
    ctx.fillStyle = 'rgba(249,115,22,0.9)'; ctx.font = 'bold 9px Helvetica Neue,Arial';
    ctx.textAlign = 'center'; ctx.fillText('Laser', (sx1+sx2)/2, RAST_Y + 12);
  }

  // Row backgrounds and depth labels
  for (var i = 0; i < n; i++) {
    var rowY = RAST_Y + TOP_PAD + i * rowH;
    if (i % 2 === 0) { ctx.fillStyle = 'rgba(255,255,255,0.013)'; ctx.fillRect(RX, rowY, RW, rowH); }
    ctx.fillStyle = unitColor(spikes[i].depth); ctx.font = '9px Helvetica Neue,Arial';
    ctx.textAlign = 'left'; ctx.fillText(spikes[i].depth + 'µm', RX + 3, rowY + rowH * 0.72);
  }

  // Event lines (dashed)
  ctx.setLineDash([2, 2]);
  var rmarks = [
    [ev.targ_on, 'rgba(251,191,36,0.4)'],
    [ev.fp_off,  'rgba(255,255,255,0.2)'],
    [ev.sac_made,'rgba(34,211,238,0.3)']
  ];
  for (var ri = 0; ri < rmarks.length; ri++) {
    if (!rmarks[ri][0]) continue;
    ctx.strokeStyle = rmarks[ri][1]; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(tToX(rmarks[ri][0]), RAST_Y); ctx.lineTo(tToX(rmarks[ri][0]), RAST_Y + RAST_H); ctx.stroke();
  }
  ctx.setLineDash([]);

  // Spike ticks
  for (var i = 0; i < n; i++) {
    var rowY = RAST_Y + TOP_PAD + i * rowH;
    ctx.strokeStyle = unitColor(spikes[i].depth); ctx.lineWidth = 1.4;
    var sps = spikes[i].spikes;
    for (var j = 0; j < sps.length; j++) {
      if (sps[j] > t) break;
      if (sps[j] < T_START) continue;
      var sx = tToX(sps[j]);
      ctx.beginPath(); ctx.moveTo(sx, rowY + 2); ctx.lineTo(sx, rowY + rowH - 2); ctx.stroke();
    }
  }

  // Spike count in stim window (shown during laser trial once stim_on reached)
  if (trial === 'laser' && ev.stim_on !== null && t >= ev.stim_on) {
    var sx2 = tToX(ev.stim_off);
    for (var i = 0; i < n; i++) {
      var rowY = RAST_Y + TOP_PAD + i * rowH;
      var cnt = 0;
      var sps = spikes[i].spikes;
      for (var j = 0; j < sps.length; j++) {
        if (sps[j] > Math.min(t, ev.stim_off)) break;
        if (sps[j] >= ev.stim_on) cnt++;
      }
      if (cnt > 0) {
        ctx.fillStyle = 'rgba(249,115,22,0.95)'; ctx.font = 'bold 8px Helvetica Neue,Arial';
        ctx.textAlign = 'left'; ctx.fillText(cnt, sx2 + 2, rowY + rowH * 0.72);
      }
    }
  }

  // Time cursor
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(tToX(t), RAST_Y); ctx.lineTo(tToX(t), RAST_Y + RAST_H); ctx.stroke();

  ctx.fillStyle = '#8b949e'; ctx.font = '10px Helvetica Neue,Arial'; ctx.textAlign = 'left';
  ctx.fillText('Spikes — selected units, superficial → deep', RX + 4, RAST_Y + 13);

  ctx.fillStyle = '#484f58'; ctx.font = '9px Helvetica Neue,Arial'; ctx.textAlign = 'center';
  for (var tx = 0; tx <= 2; tx += 0.5) {
    ctx.fillText(tx.toFixed(1) + 's', tToX(tx), RAST_Y + RAST_H + 13);
  }
  ctx.fillStyle = '#484f58'; ctx.textAlign = 'center';
  ctx.fillText('Time from fixation onset (s)', PAD + INNER_W / 2, RAST_Y + RAST_H + 23);
}

function updateLabel(ph) {
  var lbl = document.getElementById('trial-label');
  if (ph.trial === 'no_laser') { lbl.textContent = 'No Laser'; lbl.style.color = '#58a6ff'; }
  else if (ph.trial === 'laser') { lbl.textContent = 'Laser (FEF Stimulation)'; lbl.style.color = '#f97316'; }
  else { lbl.textContent = '—'; lbl.style.color = '#484f58'; }
}

function draw() {
  ctx.clearRect(0, 0, CW, CH);
  ctx.fillStyle = '#09111f'; ctx.fillRect(0, 0, CW, CH);
  var ph = getPhase(g);
  updateLabel(ph);
  if (ph.trial === 'transition') {
    drawTransition(ph.frac);
    ctx.fillStyle = '#0d1424'; ctx.fillRect(PAD, EYE_Y, INNER_W, EYE_H);
    ctx.fillStyle = '#080d19'; ctx.fillRect(PAD, RAST_Y, INNER_W, RAST_H);
  } else {
    drawStimDisplay(ph.trial, ph.t);
    drawEyeTrace(ph.trial, ph.t);
    drawRaster(ph.trial, ph.t);
  }
  document.getElementById('sc').value = Math.round(g / TOTAL * 6100);
  var tstr = ph.t !== null ? (ph.t >= 0 ? '+' : '') + ph.t.toFixed(3) + ' s' : '—';
  document.getElementById('tdisp').textContent = 't = ' + tstr;
}

function animate(ts) {
  if (!playing) return;
  if (lastTs !== null) { g += (ts - lastTs) / 1000; if (g > TOTAL) g = 0; }
  lastTs = ts; draw(); requestAnimationFrame(animate);
}

function togglePlay() {
  playing = !playing;
  document.getElementById('pb').innerHTML = playing ? '&#9646;&#9646; Pause' : '&#9654; Play';
  if (playing) { lastTs = null; requestAnimationFrame(animate); }
}

function scrub(v) { g = (v / 6100) * TOTAL; draw(); }

canvas.addEventListener('click', togglePlay);
draw();
</script>
</body>
