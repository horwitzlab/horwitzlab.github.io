{{ define "main" }}
<div class="page-header">
  <div class="page-header-inner">
    <h1>Useful Links</h1>
  </div>
</div>
<div class="page-content">
  <div class="links-sections">
    {{ range .Site.Data.links }}
    <div class="links-section">
      <p class="links-category">{{ .category }}</p>
      <div class="links-rows">
        {{ range .items }}
        <a class="links-row" href="{{ .url }}" target="_blank" rel="noopener">
          {{ if .icon }}<i class="ti {{ .icon }}" aria-hidden="true"></i>{{ end }}
          {{ .label }}
        </a>
        {{ end }}
      </div>
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
