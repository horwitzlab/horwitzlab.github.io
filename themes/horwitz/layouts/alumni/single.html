{{ define "main" }}
<div class="page-header">
  <div class="page-header-inner">
    <h1>Alumni</h1>
  </div>
</div>
<div class="page-content">
  <div class="alumni-list">
    {{ range .Site.Data.alumni }}
    <div class="alumni-card">
      {{ if .photo }}
      <img class="alumni-photo" src="{{ .photo }}" alt="{{ .name }}" loading="lazy">
      {{ else }}
      <div class="alumni-photo-placeholder">Photo<br>coming soon</div>
      {{ end }}
      <div class="alumni-info">
        <h2>{{ .name }}</h2>
        <p class="alumni-role">{{ .role }}</p>
        {{ if .current }}<p class="alumni-current">{{ .current }}</p>{{ end }}
      </div>
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
