- name: Greg Horwitz
  role: Principal Investigator
  photo: "https://depts.washington.edu/horwitzlab/wordpress/wp-content/uploads/2023/02/Greg-small-1024x1024.jpg"
  bio: >
    Greg was born in Eugene, Oregon, grew up in Concord, Massachusetts, and returned to the
    Pacific Northwest to join the faculty at the University of Washington in 2007. He and members
    of his lab use tools from neurophysiology, statistics, and viral gene delivery to study the
    neural basis of vision and perceptual decision-making. Greg is particularly enthusiastic about
    microfabricated electrode arrays and cis-regulatory elements to achieve experimental access to
    individual cell types in the visual system.
  links:
