- name: Greg Horwitz
  role: Principal Investigator
  scholar_url: "https://scholar.google.com/citations?user=-nn81AsAAAAJ&hl=en"
  photo: "https://depts.washington.edu/horwitzlab/wordpress/wp-content/uploads/2023/02/Greg-small-1024x1024.jpg"
  bio: >
    Greg was born in Eugene, Oregon, grew up in Concord, Massachusetts, and returned to the
    Pacific Northwest to join the faculty at the University of Washington in 2007. He and members
    of his lab use tools from neurophysiology, statistics, and viral gene delivery to study the
    neural basis of vision and perceptual decision-making. Greg is particularly enthusiastic about
    microfabricated electrode arrays and cis-regulatory elements to achieve experimental access to
    individual cell types in the visual system.
  links:
    - label: UW Neurobiology & Biophysics Profile
      url: https://nbio.uw.edu/people/entry/ghorwitz/
    - label: UW Bioengineering Profile
      url: https://bioe.uw.edu/portfolio-items/greg-horwitz/

- name: J. Mike Hasse
  role: Research Scientist
  scholar_url: "https://scholar.google.com/citations?user=K1c6CcgAAAAJ&hl=en"
  photo: /images/mike-hasse.jpg
  bio: >
    Mike is a Research Scientist in the Horwitz Lab. He completed his PhD in Farran Briggs's lab at the University of Rochester Medical Center, where he studied morphological heterogeneity among corticogeniculate neurons. He subsequently worked as a postdoctoral researcher in the Visual Neuroscience Lab at New York University with J. Anthony Movshon and Michael Hawken. His research focuses on how feedback projections from the visual cortex to the lateral geniculate nucleus shape the processing of visual information.

- name: Samuele Virgili
  role: Postdoctoral Researcher (in collaboration with Rieke Lab)
  scholar_url: "https://scholar.google.com/citations?user=s3pqyJEAAAAJ&hl=en"
  photo: /images/samuele-virgili.jpg
  bio: >
    Samuele is a Postdoctoral Researcher in the Horwitz Lab, working in collaboration with the Rieke Lab. He received his training at the Institut de la Vision at Sorbonne Universite (INSERM/CNRS) in Paris, where he worked in Olivier Marre's group. His research focuses on how the retina encodes visual information, with an emphasis on motion segmentation, the representation of natural scenes, and the application of Gaussian process models to understand neural responses. At UW, he brings this expertise in retinal computation to questions about how visual signals are transformed along the pathway from the eye to the cortex.

- name: Luke Bun
  role: Graduate Student
  scholar_url: "https://scholar.google.com/citations?user=lCGaOhcAAAAJ&hl=en"
  photo: "https://depts.washington.edu/horwitzlab/wordpress/wp-content/uploads/2023/02/Luke_small-1-1024x1024.jpg"
  bio: >
    Luke was born and raised in Seattle. Seeking an academic challenge, at the ripe age of 15,
    Luke started his undergrad at the UW. While majoring in Neuroscience, he found himself
    fascinated by neural engineering. Wanting to learn more about the technical side of neural
    engineering, Luke moved down the street to the Department of Bioengineering to complete a Ph.D.
    He is interested in the function and computations of complex cells in cortical area V1 and
    analogous units in convolutional neural networks. Outside the lab, he enjoys playing video
    games and learning about US and world history.

- name: Padideh Yazdan-Shahmorad
  role: Graduate Student
  scholar_url: "https://scholar.google.com/citations?user=COe8Jw0AAAAJ&hl=en"
  photo: "https://depts.washington.edu/horwitzlab/wordpress/wp-content/uploads/2023/02/Padideh_small-1024x1024.jpg"
  bio: >
    Padideh was born and raised in Esfahan, Iran. She has a bachelor's in Physics from Isfahan
    University of Technology and a master's in cognitive rehabilitation from Shahid Beheshti
    University, Tehran. She moved to Seattle to pursue her graduate education in the Electrical
    and Computer Engineering program in April 2021. She is interested in visual neuroscience.
    Her research focuses on developing a new tool to inactivate neural activity in a powerful
    and reversible way, by combining an optical system with a genetically engineered vector.
    In her free time, Padideh enjoys running, hiking, watching movies and cooking.

- name: Ryan Ressmeyer
  role: Graduate Student
  scholar_url: "https://scholar.google.com/citations?user=YIK_mgoAAAAJ&hl=en"
  photo: "https://depts.washington.edu/horwitzlab/wordpress/wp-content/uploads/2023/02/RyanR_small.jpg"
  bio: >
    A Seattle native, Ryan joined the Horwitz Lab after receiving his degree in Electrical
    Engineering from Stanford University. Now, Ryan designs high-resolution digital eye trackers
    to study the functional properties of the early visual system with high precision. Outside of
    the lab, Ryan can be found climbing, gaming, woodworking, and playing Ultimate Frisbee.

- name: Aiden Starr
  role: Undergraduate Researcher
  scholar_url: "https://www.linkedin.com/in/aiden-starr-5181b0248"
  photo: /images/aiden-starr.jpg
  bio: >
    Aiden is an Undergraduate Researcher in the Horwitz Lab, mentored by Ryan Ressmeyer. He grew up in Auburn, Washington, and is pursuing a degree in Biochemistry at UW. His research uses white noise analysis methods to characterize neural responses in macaque lateral geniculate nucleus (LGN). Aiden presented this work at the 2025 Hendrickson Trainee Symposium and is a recipient of the Mary Gates Research Scholarship.
